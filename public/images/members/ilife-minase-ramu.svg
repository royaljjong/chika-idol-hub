<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="grad-ilife-minase-ramu" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4169E1" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>
    <filter id="shadow-ilife-minase-ramu">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" fill="#07090F" />
  <circle cx="250" cy="220" r="170" fill="#4169E1" opacity="0.3" filter="blur(30px)" />
  <circle cx="250" cy="220" r="140" fill="url(#grad-ilife-minase-ramu)" stroke="#4169E1" stroke-width="4" filter="url(#shadow-ilife-minase-ramu)" />

  <!-- Center Initial Kanji -->
  <text x="250" y="270" font-family="'Klee One', 'Yu Mincho', serif" font-weight="900" font-size="130" fill="#FFFFFF" text-anchor="middle" filter="url(#shadow-ilife-minase-ramu)">
    水
  </text>

  <!-- Member Label Pill -->
  <rect x="80" y="380" width="340" height="74" rx="24" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" filter="url(#shadow-ilife-minase-ramu)" />

  <text x="250" y="415" font-family="'Klee One', 'Gowun Batang', sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF" text-anchor="middle">
    水瀬らむ (미나세 라무)
  </text>

  <text x="250" y="440" font-family="monospace" font-weight="600" font-size="13" fill="#4169E1" text-anchor="middle">
    iLiFE!
  </text>
</svg>