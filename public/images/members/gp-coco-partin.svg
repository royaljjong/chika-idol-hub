<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="grad-gp-coco-partin" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>
    <filter id="shadow-gp-coco-partin">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="#07090F" />
  <circle cx="250" cy="220" r="170" fill="#FF4500" opacity="0.3" filter="blur(30px)" />
  <circle cx="250" cy="220" r="140" fill="url(#grad-gp-coco-partin)" stroke="#FF4500" stroke-width="4" filter="url(#shadow-gp-coco-partin)" />

  <text x="250" y="270" font-family="'Klee One', 'Yu Mincho', serif" font-weight="900" font-size="130" fill="#FFFFFF" text-anchor="middle" filter="url(#shadow-gp-coco-partin)">
