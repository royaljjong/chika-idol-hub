<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-colorful-scream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="glow-colorful-scream" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D1FAE5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#D1FAE5" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow-colorful-scream">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-colorful-scream)" />
  <circle cx="950" cy="200" r="400" fill="url(#glow-colorful-scream)" />
  <circle cx="250" cy="500" r="350" fill="url(#glow-colorful-scream)" />

  <!-- Stars Particles -->
  <g fill="#FFF" opacity="0.6">
    <circle cx="120" cy="80" r="2" />
    <circle cx="280" cy="140" r="3" />
    <circle cx="450" cy="90" r="2" />
    <circle cx="780" cy="120" r="2.5" />
    <circle cx="920" cy="70" r="3" />
    <circle cx="1100" cy="150" r="2" />
    <circle cx="150" cy="400" r="2.5" />
    <circle cx="340" cy="520" r="2" />
    <circle cx="850" cy="480" r="3" />
    <circle cx="1050" cy="530" r="2" />
  </g>

  <!-- Central Emblem Card -->
  <rect x="80" y="80" width="1040" height="470" rx="36" fill="rgba(7, 9, 15, 0.45)" stroke="rgba(255,255,255,0.2)" stroke-width="2" filter="url(#shadow-colorful-scream)" backdrop-filter="blur(20px)" />

  <text x="600" y="240" font-size="100" text-anchor="middle">🐙</text>

  <text x="600" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="4" filter="url(#shadow-colorful-scream)">
    カラフルスクリーム
  </text>

  <text x="600" y="410" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="24" fill="#D1FAE5" text-anchor="middle" letter-spacing="2">
    関西・大阪 • 難波 • 王道メロディックライブ
  </text>
  
  <text x="600" y="460" font-family="monospace" font-weight="bold" font-size="16" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="4">
    OFFICIAL IDOL GROUP • CHIKA IDOL DIRECTORY
  </text>
</svg>